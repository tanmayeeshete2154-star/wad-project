<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Stock Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- CSS -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="d-flex">

  <!-- Sidebar -->
  <div class="sidebar p-3">
    <h4 class="text-white text-center">📊 Stock Admin</h4>
    <a href="#">Dashboard</a>
    <a href="#">Market</a>
    <a href="#">Portfolio</a>
    <a href="#">Reports</a>
  </div>

  <!-- Main -->
  <div class="main-content flex-grow-1">

    <!-- Navbar -->
    <nav class="navbar bg-white shadow-sm p-3">
      <span class="fw-bold">Dashboard</span>
      <span>Welcome 👋</span>
    </nav>

    <div class="container-fluid mt-4">

      <!-- Cards -->
      <div class="row g-4">
        <div class="col-md-3 col-sm-6">
          <div class="card p-3 shadow-sm">
            <h6>Total Investment</h6>
            <h4>₹2,50,000</h4>
          </div>
        </div>

        <div class="col-md-3 col-sm-6">
          <div class="card p-3 shadow-sm">
            <h6>Profit</h6>
            <h4 class="text-success">+₹5,200</h4>
          </div>
        </div>

        <div class="col-md-3 col-sm-6">
          <div class="card p-3 shadow-sm">
            <h6>Loss</h6>
            <h4 class="text-danger">-₹1,200</h4>
          </div>
        </div>

        <div class="col-md-3 col-sm-6">
          <div class="card p-3 shadow-sm">
            <h6>Stocks</h6>
            <h4>18</h4>
          </div>
        </div>
      </div>

      <!-- Charts Row -->
      <div class="row mt-4">

        <!-- 📈 Line Chart -->
        <div class="col-md-8">
          <div class="card p-3 shadow-sm">
            <h5>Market Trend</h5>
            <canvas id="lineChart"></canvas>
          </div>
        </div>

        <!-- 🥧 Pie Chart -->
        <div class="col-md-4">
          <div class="card p-3 shadow-sm">
            <h5>Portfolio Distribution</h5>
            <canvas id="pieChart"></canvas>
          </div>
        </div>

      </div>

    </div>
  </div>
</div>

<!-- Charts Script -->
<script>

// 📈 LINE CHART (Market Trend)
new Chart(document.getElementById("lineChart"), {
  type: 'line',
  data: {
    labels: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'],
    datasets: [{
      label: 'Stock Price (₹)',
      data: [120, 190, 170, 220, 200, 250],
      fill: false,
      borderWidth: 3,
      tension: 0.4
    }]
  },
  options: {
    responsive: true,
    plugins: {
      legend: { display: true }
    }
  }
});


// 🥧 PIE CHART (Portfolio)
new Chart(document.getElementById("pieChart"), {
  type: 'pie',
  data: {
    labels: ['Reliance', 'TCS', 'Infosys', 'HDFC'],
    datasets: [{
      data: [30, 25, 20, 25],
      borderWidth: 1
    }]
  },
  options: {
    responsive: true
  }
});

</script>

</body>
</html>
